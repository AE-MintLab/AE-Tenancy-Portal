    <!-- =========================================

    <script>


        /* =========================================
           THEME
        ========================================== */

        function toggleTheme() {

            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');


            if (html.classList.contains('dark')) {

                html.classList.remove('dark');

                icon.innerText = '☀️ Light';

                localStorage.setItem('theme', 'light');

            }

            else {

                html.classList.add('dark');

                icon.innerText = '🌙 Dark';

                localStorage.setItem('theme', 'dark');

            }

        }



        /* =========================================
           INITIAL THEME
        ========================================== */

        if (
            localStorage.getItem('theme') === 'dark' ||
            (
                !('theme' in localStorage) &&
                window.matchMedia('(prefers-color-scheme: dark)').matches
            )
        ) {

            document.documentElement.classList.add('dark');

            document.getElementById('theme-icon').innerText = '🌙 Dark';

        }

        else {

            document.documentElement.classList.remove('dark');

            document.getElementById('theme-icon').innerText = '☀️ Light';

        }



        /* =========================================
           DOCUMENT GENERATOR
        ========================================== */

        async function generateDoc() {

            const fileInput = document.getElementById('docx-input');


            if (!fileInput.files[0]) {

                alert('Please upload your .docx master document first.');

                return;

            }


            const replacements = {

                "DURATION":
                    document.getElementById('DURATION').value,

                "DURATION_YEAR":
                    document.getElementById('DURATION_YEAR').value,

                "START_DATE":
                    document.getElementById('START_DATE').value,

                "END_DATE":
                    document.getElementById('END_DATE').value,

                "RENEW":
                    document.getElementById('RENEW').value,

                "RENEW_YEAR":
                    document.getElementById('RENEW_YEAR').value,

                "BANK_DETAIL":
                    document.getElementById('BANK_DETAIL').value,

                "LANDLORD_NAME":
                    document.getElementById('LANDLORD_NAME').value,

                "LANDLORD_IC":
                    document.getElementById('LANDLORD_IC').value,

                "LANDLORD_PHONE":
                    document.getElementById('LANDLORD_PHONE').value,

                "LANDLORD_ADDRESS":
                    document.getElementById('LANDLORD_ADDRESS').value,

                "TENANT_NAME":
                    document.getElementById('TENANT_NAME').value,

                "TENANT_IC":
                    document.getElementById('TENANT_IC').value,

                "TENANT_PHONE":
                    document.getElementById('TENANT_PHONE').value,

                "TENANT_ADDRESS":
                    document.getElementById('TENANT_ADDRESS').value,

                "PROPERTY_ADDRESS":
                    document.getElementById('PROPERTY_ADDRESS').value,

                "RENTAL_AMOUNT":
                    document.getElementById('RENTAL_AMOUNT').value,

                "RENTAL_NUMBER":
                    document.getElementById('RENTAL_NUMBER').value,

                "DEPOSIT_AMOUNT":
                    document.getElementById('DEPOSIT_AMOUNT').value,

                "DEPOSIT_NUMBER":
                    document.getElementById('DEPOSIT_NUMBER').value,

                "UTILITY_DEPOSIT":
                    document.getElementById('UTILITY_DEPOSIT').value,

                "UTILITY_NUMBER":
                    document.getElementById('UTILITY_NUMBER').value

            };


            try {


                /* =========================================
                   LOAD DOCX
                ========================================== */

                const zip =
                    await JSZip.loadAsync(fileInput.files[0]);


                const xmlFiles =
                    Object.keys(zip.files).filter(
                        fileName =>
                            fileName.startsWith('word/') &&
                            fileName.endsWith('.xml')
                    );


                /* =========================================
                   PROCESS WORD XML
                ========================================== */

                for (const fileName of xmlFiles) {

                    const xmlFile = zip.file(fileName);


                    if (xmlFile) {

                        let content =
                            await xmlFile.async("string");


                        /*
                         * Normalize placeholder formatting
                         */

                        content = content.replace(
                            /(<w:t[^>]*>)([\s\S]*?)(<\/w:t>)/g,
                            (match, openTag, text, closeTag) => {
                                return openTag + text + closeTag;
                            }
                        );


                        /*
                         * Normalize placeholders
                         */

                        content = content.replace(
                            /\[\s*(?:<[^>]+>)*\s*([A-Z0-9_]+)\s*(?:<[^>]+>)*\s*\]/g,
                            '[$1]'
                        );


                        /*
                         * Repair placeholders split
                         * across Word XML runs
                         */

                        for (
                            const key of Object.keys(replacements)
                        ) {

                            const brokenRegex =
                                new RegExp(
                                    '\\[\\s*' +
                                    key
                                        .split('')
                                        .join('(?:<[^>]+>)*') +
                                    '\\s*\\]',
                                    'g'
                                );


                            content =
                                content.replace(
                                    brokenRegex,
                                    `[${key}]`
                                );

                        }


                        /*
                         * Replace placeholders
                         * with form values
                         */

                        for (
                            const [key, value]
                            of Object.entries(replacements)
                        ) {

                            const safeValue =
                                String(value)

                                    .replace(
                                        /&/g,
                                        '&amp;'
                                    )

                                    .replace(
                                        /</g,
                                        '&lt;'
                                    )

                                    .replace(
                                        />/g,
                                        '&gt;'
                                    )

                                    .replace(
                                        /"/g,
                                        '&quot;'
                                    )

                                    .replace(
                                        /'/g,
                                        '&apos;'
                                    );


                            const targetKey =
                                `[${key}]`;


                            content =
                                content
                                    .split(targetKey)
                                    .join(safeValue);

                        }


                        zip.file(
                            fileName,
                            content
                        );

                    }

                }


                /* =========================================
                   GENERATE DOCX
                ========================================== */

                const blob =
                    await zip.generateAsync({

                        type: "blob",

                        mimeType:
                            "application/vnd.openxmlformats-officedocument.wordprocessingml.document"

                    });


                /* =========================================
                   FILE NAME
                ========================================== */

                const tenantName =
                    replacements["TENANT_NAME"]
                        .replace(
                            /[^a-z0-9]/gi,
                            '_'
                        );


                const fileName =
                    `Tenancy_Agreement_${tenantName || 'Generated'}.docx`;


                /* =========================================
                   DOWNLOAD
                ========================================== */

                const link =
                    document.createElement('a');


                link.href =
                    URL.createObjectURL(blob);


                link.download =
                    fileName;


                document.body.appendChild(link);


                link.click();


                document.body.removeChild(link);


                URL.revokeObjectURL(
                    link.href
                );


            }


            catch (err) {

                alert(
                    "Error processing document: " +
                    err.message
                );

            }

        }



        /* =========================================
           PWA SERVICE WORKER
        ========================================== */

        if ('serviceWorker' in navigator) {

            window.addEventListener(
                'load',
                () => {

                    navigator.serviceWorker
                        .register('./sw.js')

                        .then(
                            (registration) => {

                                console.log(
                                    'AE Tenancy Portal service worker registered:',
                                    registration.scope
                                );

                            }
                        )

                        .catch(
                            (error) => {

                                console.error(
                                    'AE Tenancy Portal service worker registration failed:',
                                    error
                                );

                            }
                        );

                }
            );

        }

    </script>

</body>
</html>
