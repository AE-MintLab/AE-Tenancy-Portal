        // 1. Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Failed', err));
            });
        }

        // 2. PWA Install Event Handler
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        async function triggerPWAInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    const btn = document.getElementById('pwa-install-btn');
                    if (btn) btn.style.display = 'none';
                }
                deferredPrompt = null;
            } else {
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                if (isIOS) {
                    alert("To install on iOS:\n1. Tap the Share icon in Safari\n2. Select 'Add to Home Screen'");
                } else {
                    alert("To install this app:\n1. Tap your browser menu (⋮ in top right)\n2. Select 'Add to Home screen' or 'Install app'");
                }
            }
        }

        // 3. Robust Theme Toggle Handler
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                if (icon) icon.innerText = '☀️ Light';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                if (icon) icon.innerText = '🌙 Dark';
                localStorage.setItem('theme', 'dark');
            }
        }

        // Initialize Theme Safely on Load
        document.addEventListener('DOMContentLoaded', () => {
            const icon = document.getElementById('theme-icon');
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                if (icon) icon.innerText = '🌙 Dark';
            } else {
                document.documentElement.classList.remove('dark');
                if (icon) icon.innerText = '☀️ Light';
            }
        });

        // 4. Safe Document Generator Function
        async function generateDoc(event) {
            if (event) event.preventDefault(); // Prevents page reload in PWA mode

            const fileInput = document.getElementById('docx-input');
            if (!fileInput || !fileInput.files[0]) {
                alert('Please upload your .docx master document first.');
                return;
            }

            if (typeof JSZip === 'undefined') {
                alert('JSZip engine is loading. Please retry in 3 seconds.');
                return;

                const el = document.getElementById(id);
                return el ? el.value : '';
            };

                "LANDLORD_ADDRESS": getValue('LANDLORD_ADDRESS'),

                "TENANT_PHONE": getValue('TENANT_PHONE'),
                "TENANT_ADDRESS": getValue('TENANT_ADDRESS'),
                "PROPERTY_ADDRESS": getValue('PROPERTY_ADDRESS'),
                "RENTAL_AMOUNT": getValue('RENTAL_AMOUNT'),
                "RENTAL_NUMBER": getValue('RENTAL_NUMBER'),
                "DEPOSIT_AMOUNT": getValue('DEPOSIT_AMOUNT'),
                "DEPOSIT_NUMBER": getValue('DEPOSIT_NUMBER'),
                "UTILITY_DEPOSIT": getValue('UTILITY_DEPOSIT'),
                "UTILITY_NUMBER": getValue('UTILITY_NUMBER'),
            };

            try {
                const zip = await JSZip.loadAsync(fileInput.files[0]);
                const xmlFiles = Object.keys(zip.files).filter(fileName => fileName.startsWith('word/') && fileName.endsWith('.xml'));

                for (const fileName of xmlFiles) {
                    const xmlFile = zip.file(fileName);
                    if (xmlFile) {
                        let content = await xmlFile.async("string");

                        // Fix XML breaks inside word brackets
                        content = content.replace(/\[\s*(?:<[^>]+>)*\s*([A-Z0-9_]+)\s*(?:<[^>]+>)*\s*\]/g, '[$1]');

                        for (const key of Object.keys(replacements)) {
                            const brokenRegex = new RegExp('\\[\\s*' + key.split('').join('(?:<[^>]+>)*') + '\\s*\\]', 'g');
                            content = content.replace(brokenRegex, `[${key}]`);
                        }

                        // Sanitize & replace variables
                        for (const [key, value] of Object.entries(replacements)) {
                            const safeValue = String(value)
                                .replace(/&/g, '&amp;')
                                .replace(/</g, '&lt;')
                                .replace(/>/g, '&gt;')
                                .replace(/"/g, '&quot;')
                                .replace(/'/g, '&apos;');
                            
                            content = content.split(`[${key}]`).join(safeValue);
                        }

                        zip.file(fileName, content);
                    }

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.innerText = '☀️ Light';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                icon.innerText = '🌙 Dark';
                localStorage.setItem('theme', 'dark');
            }
        }

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-icon').innerText = '🌙 Dark';
        } else {
            document.documentElement.classList.remove('dark');
            document.getElementById('theme-icon').innerText = '☀️ Light';
        }

        async function generateDoc() {
            const fileInput = document.getElementById('docx-input');
            if (!fileInput.files[0]) {
                alert('Please upload your .docx master document first.');
                return;
            }

            const replacements = {
                "DURATION": document.getElementById('DURATION').value,
                "DURATION_YEAR": document.getElementById('DURATION_YEAR').value,
                "START_DATE": document.getElementById('START_DATE').value,
                "END_DATE": document.getElementById('END_DATE').value,
                "RENEW": document.getElementById('RENEW').value,
                "RENEW_YEAR": document.getElementById('RENEW_YEAR').value,
                "BANK_DETAIL": document.getElementById('BANK_DETAIL').value,
                "LANDLORD_NAME": document.getElementById('LANDLORD_NAME').value,
                "LANDLORD_IC": document.getElementById('LANDLORD_IC').value,
                "LANDLORD_PHONE": document.getElementById('LANDLORD_PHONE').value,
                "LANDLORD_ADDRESS": document.getElementById('LANDLORD_ADDRESS').value,
                "TENANT_NAME": document.getElementById('TENANT_NAME').value,
                "TENANT_IC": document.getElementById('TENANT_IC').value,
                "TENANT_PHONE": document.getElementById('TENANT_PHONE').value,
                "TENANT_ADDRESS": document.getElementById('TENANT_ADDRESS').value,
                "PROPERTY_ADDRESS": document.getElementById('PROPERTY_ADDRESS').value,
                "RENTAL_AMOUNT": document.getElementById('RENTAL_AMOUNT').value,
                "RENTAL_NUMBER": document.getElementById('RENTAL_NUMBER').value,
                "DEPOSIT_AMOUNT": document.getElementById('DEPOSIT_AMOUNT').value,
                "DEPOSIT_NUMBER": document.getElementById('DEPOSIT_NUMBER').value,
                "UTILITY_DEPOSIT": document.getElementById('UTILITY_DEPOSIT').value,
                "UTILITY_NUMBER": document.getElementById('UTILITY_NUMBER').value,
            };

            try {
                const zip = await JSZip.loadAsync(fileInput.files[0]);
                const xmlFiles = Object.keys(zip.files).filter(fileName => fileName.startsWith('word/') && fileName.endsWith('.xml'));

                for (const fileName of xmlFiles) {
                    const xmlFile = zip.file(fileName);
                    if (xmlFile) {
                        let content = await xmlFile.async("string");

                        content = content.replace(/(<w:t[^>]*>)([\s\S]*?)(<\/w:t>)/g, (match, openTag, text, closeTag) => {
                            return openTag + text + closeTag;
                        });

                        content = content.replace(/\[\s*(?:<[^>]+>)*\s*([A-Z0-9_]+)\s*(?:<[^>]+>)*\s*\]/g, '[$1]');

                        for (const key of Object.keys(replacements)) {
                            const brokenRegex = new RegExp('\\[\\s*' + key.split('').join('(?:<[^>]+>)*') + '\\s*\\]', 'g');
                            content = content.replace(brokenRegex, `[${key}]`);
                        }

                        for (const [key, value] of Object.entries(replacements)) {
                            const safeValue = String(value)
                                .replace(/&/g, '&amp;')
                                .replace(/</g, '&lt;')
                                .replace(/>/g, '&gt;')
                                .replace(/"/g, '&quot;')
                                .replace(/'/g, '&apos;');
                            
                            const targetKey = `[${key}]`;
                            content = content.split(targetKey).join(safeValue);
                        }

                        zip.file(fileName, content);
                    }
                }

                const blob = await zip.generateAsync({
                    type: "blob",
                    mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                });

                const tenantName = replacements["TENANT_NAME"].replace(/[^a-z0-9]/gi, '_');
                const fileName = `Tenancy_Agreement_${tenantName}.docx`;

                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);

            } catch (err) {
                alert("Error processing document: " + err.message);
            }
        }
    </script>
