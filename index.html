<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AE Tenancy Agreement Management System</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="theme-color" content="#f5b748">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AE Tenancy">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            gold: '#f5b748',
                            darkBg: '#0f172a',
                            darkCard: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- JSZip Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-[#0f172a] dark:text-gray-100 min-h-screen transition-colors duration-200 pb-12">

    <!-- Sticky Header -->
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-[#1e293b]/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-4 py-3">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="logo.png" alt="AE Logo" class="h-8 w-8 object-contain rounded-md" onerror="this.style.display='none'">
                <h1 class="font-bold text-sm md:text-base tracking-wide text-amber-500">AE TENANCY PORTAL</h1>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- PWA Install Button -->
                <button id="pwa-install-btn" type="button" onclick="triggerPWAInstall()" class="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs transition shadow-md flex items-center gap-1">
                    📲 <span>Install App</span>
                </button>
                
                <!-- Theme Toggle Button -->
                <button id="theme-toggle-btn" type="button" onclick="toggleTheme()" class="px-3 py-1.5 rounded-xl bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 text-xs font-semibold hover:opacity-80 transition">
                    <span id="theme-icon">☀️ Light</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
        
        <!-- File Upload Section -->
        <section class="bg-white dark:bg-[#1e293b] p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800">
            <h2 class="text-xs uppercase tracking-wider font-bold text-amber-500 mb-3">1. Select Master Template</h2>
            <input type="file" id="docx-input" accept=".docx" class="block w-full text-xs text-gray-500 dark:text-gray-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-500/10 file:text-amber-500 hover:file:bg-amber-500/20 cursor-pointer">
        </section>

        <!-- Dynamic Form Fields -->
        <div class="space-y-6">
            
            <!-- Duration & Dates -->
            <section class="bg-white dark:bg-[#1e293b] p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 space-y-4">
                <h2 class="text-xs uppercase tracking-wider font-bold text-amber-500">2. Tenancy Details</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    <div>
                        <label class="block mb-1 font-medium">DURATION (Words)</label>
                        <input type="text" id="DURATION" placeholder="e.g. ONE (1) YEAR" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">DURATION_YEAR (Number)</label>
                        <input type="text" id="DURATION_YEAR" placeholder="e.g. 1" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">START_DATE</label>
                        <input type="text" id="START_DATE" placeholder="e.g. 1st January 2026" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">END_DATE</label>
                        <input type="text" id="END_DATE" placeholder="e.g. 31st December 2026" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">RENEW (Words)</label>
                        <input type="text" id="RENEW" placeholder="e.g. ONE (1) YEAR" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">RENEW_YEAR (Number)</label>
                        <input type="text" id="RENEW_YEAR" placeholder="e.g. 1" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                </div>
            </section>

            <!-- Landlord Information -->
            <section class="bg-white dark:bg-[#1e293b] p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 space-y-4">
                <h2 class="text-xs uppercase tracking-wider font-bold text-amber-500">3. Landlord Information</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    <div>
                        <label class="block mb-1 font-medium">LANDLORD_NAME</label>
                        <input type="text" id="LANDLORD_NAME" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">LANDLORD_IC</label>
                        <input type="text" id="LANDLORD_IC" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">LANDLORD_PHONE</label>
                        <input type="text" id="LANDLORD_PHONE" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">BANK_DETAIL</label>
                        <input type="text" id="BANK_DETAIL" placeholder="Bank Name & Account No." class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block mb-1 font-medium">LANDLORD_ADDRESS</label>
                        <input type="text" id="LANDLORD_ADDRESS" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                </div>
            </section>

            <!-- Tenant Information -->
            <section class="bg-white dark:bg-[#1e293b] p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 space-y-4">
                <h2 class="text-xs uppercase tracking-wider font-bold text-amber-500">4. Tenant Information</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    <div>
                        <label class="block mb-1 font-medium">TENANT_NAME</label>
                        <input type="text" id="TENANT_NAME" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">TENANT_IC</label>
                        <input type="text" id="TENANT_IC" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block mb-1 font-medium">TENANT_PHONE</label>
                        <input type="text" id="TENANT_PHONE" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block mb-1 font-medium">TENANT_ADDRESS</label>
                        <input type="text" id="TENANT_ADDRESS" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                </div>
            </section>

            <!-- Property & Financials -->
            <section class="bg-white dark:bg-[#1e293b] p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 space-y-4">
                <h2 class="text-xs uppercase tracking-wider font-bold text-amber-500">5. Property & Payment Details</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    <div class="md:col-span-2">
                        <label class="block mb-1 font-medium">PROPERTY_ADDRESS</label>
                        <input type="text" id="PROPERTY_ADDRESS" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">RENTAL_AMOUNT (Words)</label>
                        <input type="text" id="RENTAL_AMOUNT" placeholder="e.g. RINGGIT MALAYSIA ONE THOUSAND" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">RENTAL_NUMBER (RM)</label>
                        <input type="text" id="RENTAL_NUMBER" placeholder="e.g. 1,000.00" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">DEPOSIT_AMOUNT (Words)</label>
                        <input type="text" id="DEPOSIT_AMOUNT" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">DEPOSIT_NUMBER (RM)</label>
                        <input type="text" id="DEPOSIT_NUMBER" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">UTILITY_DEPOSIT (Words)</label>
                        <input type="text" id="UTILITY_DEPOSIT" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">UTILITY_NUMBER (RM)</label>
                        <input type="text" id="UTILITY_NUMBER" class="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-amber-500">
                    </div>
                </div>
            </section>

            <!-- Submit Action -->
            <button type="button" onclick="generateDoc()" class="w-full bg-[#f5b748] hover:bg-amber-400 text-black font-bold py-4 rounded-xl text-xs uppercase tracking-wider shadow-lg shadow-amber-500/10 transition active:scale-[0.99]">
                Generate Agreement (.docx)
            </button>

        </div>
    </main>

    <!-- Execution Logic -->
    <script>
        // 1. Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Failed', err));
            });
        }

        // 2. PWA Install Event Handler
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        async function triggerPWAInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    const btn = document.getElementById('pwa-install-btn');
                    if (btn) btn.style.display = 'none';
                }
                deferredPrompt = null;
            } else {
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                if (isIOS) {
                    alert("To install on iOS:\n1. Tap the Share icon in Safari\n2. Select 'Add to Home Screen'");
                } else {
                    alert("To install this app:\n1. Tap your browser menu (⋮ in top right)\n2. Select 'Add to Home screen' or 'Install app'");
                }
            }
        }

        // 3. Theme Toggle Handler
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                if (icon) icon.innerText = '☀️ Light';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                if (icon) icon.innerText = '🌙 Dark';
                localStorage.setItem('theme', 'dark');
            }
        }

        // Initialize Theme Safely on Load
        document.addEventListener('DOMContentLoaded', () => {
            const icon = document.getElementById('theme-icon');
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                if (icon) icon.innerText = '🌙 Dark';
            } else {
                document.documentElement.classList.remove('dark');
                if (icon) icon.innerText = '☀️ Light';
            }
        });

        // 4. Safe Document Generator Function
        async function generateDoc() {
            const fileInput = document.getElementById('docx-input');
            if (!fileInput || !fileInput.files[0]) {
                alert('Please upload your .docx master document first.');
                return;
            }

            if (typeof JSZip === 'undefined') {
                alert('JSZip engine is loading. Please retry in 3 seconds.');
                return;
            }

            const getValue = (id) => {
                const el = document.getElementById(id);
                return el ? el.value : '';
            };

            const replacements = {
                "DURATION": getValue('DURATION'),
                "DURATION_YEAR": getValue('DURATION_YEAR'),
                "START_DATE": getValue('START_DATE'),
                "END_DATE": getValue('END_DATE'),
                "RENEW": getValue('RENEW'),
                "RENEW_YEAR": getValue('RENEW_YEAR'),
                "BANK_DETAIL": getValue('BANK_DETAIL'),
                "LANDLORD_NAME": getValue('LANDLORD_NAME'),
                "LANDLORD_IC": getValue('LANDLORD_IC'),
                "LANDLORD_PHONE": getValue('LANDLORD_PHONE'),
                "LANDLORD_ADDRESS": getValue('LANDLORD_ADDRESS'),
                "TENANT_NAME": getValue('TENANT_NAME'),
                "TENANT_IC": getValue('TENANT_IC'),
                "TENANT_PHONE": getValue('TENANT_PHONE'),
                "TENANT_ADDRESS": getValue('TENANT_ADDRESS'),
                "PROPERTY_ADDRESS": getValue('PROPERTY_ADDRESS'),
                "RENTAL_AMOUNT": getValue('RENTAL_AMOUNT'),
                "RENTAL_NUMBER": getValue('RENTAL_NUMBER'),
                "DEPOSIT_AMOUNT": getValue('DEPOSIT_AMOUNT'),
                "DEPOSIT_NUMBER": getValue('DEPOSIT_NUMBER'),
                "UTILITY_DEPOSIT": getValue('UTILITY_DEPOSIT'),
                "UTILITY_NUMBER": getValue('UTILITY_NUMBER'),
            };

            try {
                const zip = await JSZip.loadAsync(fileInput.files[0]);
                const xmlFiles = Object.keys(zip.files).filter(fileName => fileName.startsWith('word/') && fileName.endsWith('.xml'));

                for (const fileName of xmlFiles) {
                    const xmlFile = zip.file(fileName);
                    if (xmlFile) {
                        let content = await xmlFile.async("string");

                        // Fix XML breaks inside word brackets
                        content = content.replace(/\[\s*(?:<[^>]+>)*\s*([A-Z0-9_]+)\s*(?:<[^>]+>)*\s*\]/g, '[$1]');

                        for (const key of Object.keys(replacements)) {
                            const brokenRegex = new RegExp('\\[\\s*' + key.split('').join('(?:<[^>]+>)*') + '\\s*\\]', 'g');
                            content = content.replace(brokenRegex, `[${key}]`);
                        }

                        // Sanitize & replace variables
                        for (const [key, value] of Object.entries(replacements)) {
                            const safeValue = String(value)
                                .replace(/&/g, '&amp;')
                                .replace(/</g, '&lt;')
                                .replace(/>/g, '&gt;')
                                .replace(/"/g, '&quot;')
                                .replace(/'/g, '&apos;');
                            
                            content = content.split(`[${key}]`).join(safeValue);
                        }

                        zip.file(fileName, content);
                    }
                }

                const blob = await zip.generateAsync({
                    type: "blob",
                    mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.docum
